name = "sync-stock-tiendanube"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Sincronización completa cada minuto (red de seguridad si no llega un webhook)
[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "SINCRONIZADOR"
class_name = "Sincronizador"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sincronizador"]

[observability]
enabled = true

# Variables visibles (no secretas). Los tokens van como SECRETOS en Cloudflare,
# nunca en este archivo.
[vars]
MODO_PRUEBA = "true"
PREFIJO_PRUEBA = "TEST-"
MAX_ESCRITURAS = "25"
# Cómo se emparejan las variantes (ver README):
# TIENDA_1 = como Hydra (SKU = nombre del producto en la otra tienda)
# TIENDA_2 = como For You Audaz (el nombre del producto es la clave)
EMPAREJAR = "sku+variante"
TIENDA_1_CLAVE = "sku"
TIENDA_2_CLAVE = "nombre"
API_BASE = "https://api.tiendanube.com/2025-03"
